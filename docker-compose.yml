version: '3.8'

services:
  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb+srv://Ecommerce:1234@cluster0.wlykj.mongodb.net/
    volumes:
      - ./server:/app
      - /app/node_modules
      
    command: npm run dev

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server
