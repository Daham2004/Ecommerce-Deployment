name: Docker Build and Test

on:
  push:
    branches:
      - main  # Or any branch you want to trigger the action on

jobs:
  build:
    runs-on: ubuntu-latest  # You can also use other runners

    services:
      # Set up Docker in the GitHub Action environment
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 5000:5000
          - 5173:5173

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx (for building multi-platform images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Build the Docker images
      - name: Build Docker images
        run: |
          docker-compose -f docker-compose.yml build

      # Step 4: Run server and client tests
      - name: Run Server Tests
        run: |
          docker-compose -f docker-compose.yml run server-test

      - name: Run Client Tests
        run: |
          docker-compose -f docker-compose.yml run client-test
