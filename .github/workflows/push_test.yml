name: Docker Build and Test

on:
  push:
    branches:
      - main  # Or any branch you want to trigger the action on

jobs:
  build:
    runs-on: ubuntu-latest  # You can also use other runners

    services:
      # Set up Docker in the GitHub Action environment
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 5000:5000
          - 5173:5173

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx (for building multi-platform images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # Step 4: Build the Docker images
      - name: Build Docker images
        run: |
          docker-compose -f docker-compose.yml build

      # Step 5: Install npm dependencies for the server
      - name: Install Server Dependencies
        run: |
          docker-compose -f docker-compose.yml run server npm install

      # Step 6: Install npm dependencies for the client
      - name: Install Client Dependencies
        run: |
          docker-compose -f docker-compose.yml run client npm install

      # Step 7: Run server tests
      - name: Run Server Tests
        run: |
          docker-compose -f docker-compose.yml run server-test

      # Step 8: Run client tests
      - name: Run Client Tests
        run: |
          docker-compose -f docker-compose.yml run client-test
