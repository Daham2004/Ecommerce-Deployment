name: Docker Build and Test

on:
  push:
    branches:
      - main  # Or any branch you want to trigger the action on

jobs:
  build:
    runs-on: ubuntu-latest  # You can also use other runners

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Specify the Node.js version you are using

      # Step 3: Install npm dependencies in the root
      - name: Install Root Dependencies
        run: npm install

      # Step 4: Set up Docker Compose
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # Step 5: Build Docker images
      - name: Build Docker images
        run: docker-compose -f docker-compose.yml build

      # Step 6: Run server tests
      - name: Run Server Tests
        run: docker-compose -f docker-compose.yml run server-test

      # Step 7: Run client tests
      - name: Run Client Tests
        run: docker-compose -f docker-compose.yml run client-test

