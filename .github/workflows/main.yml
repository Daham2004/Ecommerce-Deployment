name: CI testing Workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      run: |
        docker --version
        docker compose version

    - name: Build and Start Services
      run: |
        docker compose up -d --build

    - name: Wait for Services to Be Ready
      run: |
        until curl -s http://localhost:5000/health || curl -s http://localhost:5173; do
          echo "Waiting for services to be ready..."
          sleep 5
        done

    - name: Run Tests in Client
      run: |
        docker compose exec client npm test

    - name: Stop Services
      if: always()
      run: |
        docker compose down
