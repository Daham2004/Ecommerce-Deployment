name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      run: |
        docker --version

    - name: Build and Start Services
      run: |
        docker-compose up -d --build

    - name: Run Tests in Client Container
      run: |
        docker-compose exec client npm test

    - name: Stop and Clean Up
      if: always()
      run: |
        docker-compose down

